        code: |
          # -*- coding: utf-8 -*-
          import re

          def main(input):
              text = input if input else ""
              issues = []

              required = [
                  "一、岗位核心能力拆解",
                  "二、能力现状评估",
                  "三、关键差距分析",
                  "四、4周行动计划",
                  "五、面试准备建议",
                  "六、整体评分",
              ]
              for sec in required:
                  if sec not in text:
                      issues.append("缺失章节：" + sec)

              if "{{" in text or "}}" in text:
                  issues.append("存在未替换变量占位符")

              if len(text.strip()) < 1000:
                  issues.append("报告明显过短")

              text = re.sub(r"^[ \t]*\*{0,2}【[^】\n]*验证[^】\n]*】[^\n]*$\n?", "", text, flags=re.MULTILINE)
              text = re.sub(r"\n{3,}", "\n\n", text).strip()

              if issues:
                  text += "\n\n---\n> ⚠️ 自动完整性检查：" + "；".join(issues) + "。建议重新生成一次或检查节点输入。"

              return {"output": text}
