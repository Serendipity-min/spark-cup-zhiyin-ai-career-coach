          # -*- coding: utf-8 -*-
          import re


          def main(input):
              text = input if input else ""

              # 一次正则合并：删除验证行 + 空代码块 + 空加粗行
              pattern = (
                  r"^[ \t]*\*{0,2}【[^】\n]*验证[^】\n]*】[^\n]*$"
                  r"|```[ \t]*\n[ \t]*```"
                  r"|^[ \t]*\*{1,2}[ \t]*$"
              )
              text = re.sub(pattern, "", text, flags=re.MULTILINE)

              # 折叠因删除产生的多余空行
              text = re.sub(r"\n{3,}", "\n\n", text)

              return {"output": text.strip()}
