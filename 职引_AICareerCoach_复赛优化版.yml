              if text.count("[") < 10:
                  issues.append("可视化元素过少")

              # 校验报告长度
              if len(text) < 1500:
                  issues.append("报告过短")

              # 如果有严重问题，追加提示
              if issues:
                  warning = "\n\n---\n⚠️ **报告完整性提示**：\n" + "\n".join(f"- {i}" for i in issues)
                  return {"output": text + warning}

              return {"output": text}
