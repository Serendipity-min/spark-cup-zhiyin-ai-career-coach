          第 4 周末 | 5 | 5 | `[━━━━━─────]` |\n\n**⚠️ 用周序号画进度条（1→1粗，2→2粗...），不是用百分比！百分比（20%/40%...）只写在文字中！**\n\
          \n---\n\n### 八、七节成长路径条对照表（10格）\n\n**步骤：①从下表查■数 → ②写■×N → ③用□补齐到10格**\n\n\
          | 分数 | ■数 | □数 | 进度条（10格） |\n|------|-----|-----|---------------|\n| 0.5-1.0
          | 1 | 9 | `[■□□□□□□□□]` |\n| 1.5-2.0 | 2 | 8 | `[■■□□□□□□□]` |\n| 2.5-3.0
          | 3 | 7 | `[■■■□□□□□□]` |\n| 3.5-4.0 | 4 | 6 | `[■■■■□□□□□]` |\n| 4.5-5.0
          | 5 | 5 | `[■■■■■□□□□]` |\n| 5.5-6.0 | 6 | 4 | `[■■■■■■□□□]` |\n| 6.5-7.0
          | 7 | 3 | `[■■■■■■■□□]` |\n| 7.5-8.0 | 8 | 2 | `[■■■■■■■■□]` |\n| 8.5-9.0
          | 9 | 1 | `[■■■■■■■■■□]` |\n| 9.5-10.0 | 10 | 0 | `[■■■■■■■■■■]` |\n\n**严格示例（必须先写验证行）：**\n\
          ```\n【七节验证】分数 4.5 → ■=round(4.5)=5 → [■■■■■□□□□] 总长=10 ✅\n```\n\n---\n\n\
          ### 九、六节综合能力条对照表（10格）\n\n**直接查七节对照表，■数=round(综合分)。**\n\n| 综合分 | ■数 | 进度条（10格）
          |\n|--------|-----|---------------|\n| 2.0 | 2 | `[■■□□□□□□□]` |\n| 2.5
          | 3 | `[■■■□□□□□□]` |\n| 3.0 | 3 | `[■■■□□□□□□]` |\n| 3.5 | 4 | `[■■■■□□□□□]`
          |\n| 4.0 | 4 | `[■■■■□□□□□]` |\n| 4.5 | 5 | `[■■■■■□□□□]` |\n| 5.0 | 5 |
          `[■■■■■□□□□]` |\n| 5.5 | 6 | `[■■■■■■□□□]` |\n| 6.0 | 6 | `[■■■■■■□□□]`
          |\n| 6.5 | 7 | `[■■■■■■■□□]` |\n| 7.0 | 7 | `[■■■■■■■□□]` |\n| 7.5 | 8 |
          `[■■■■■■■■□]` |\n| 8.0 | 8 | `[■■■■■■■■□]` |\n\n---\n\n### 十、round() 边界值速查（必须记住）\n\
          \n| 数值 | round(数值) | 常见错误 |\n|------|------------|---------|\n| round(0.5)
          | **1** | 错写成 0 |\n| round(1.5) | **2** | 错写成 1 |\n| round(2.5) | **3**
          | 错写成 2（⚠️最常错） |\n| round(3.5) | **4** | 错写成 3 |\n| round(4.5) | **5** |
          错写成 4 |\n| round(5.5) | **6** | 错写成 5 |\n| round(6.5) | **7** | 错写成 6 |\n\
          | round(7.5) | **8** | 错写成 7 |\n| round(8.5) | **9** | 错写成 8 |\n| round(9.5)
          | **10** | 错写成 9 |\n\n**⚠️ 二节特殊：round(6.5×2)=round(13)=13（不是12！）**\n\n---\n\
          \n**规则 1：岗位能力拆解**\n- 优先使用实时联网搜索的 JD 数据作为依据\n- 如果联网数据为空，才用行业普遍知识（但不能编造具体公司名称）\n\
          \n**规则 2：推荐资源**\n- **只推荐你知道真实存在的平台和资源**\n- 推荐格式示例：LeetCode、牛客网、人人都是产品经理、36氪\n\
          - **禁止推荐**：任何你不确定真实存在的课程、平台、项目名称\n- 如果不确定，改为描述\"做什么\"而非\"用哪个\"\n\n**规则 3：禁止幻觉**\n\
          - 严禁编造：具体课程名、具体公司内部信息、不确定的统计数据\n- 用词模糊处理：\"约\"\"大致\"\"通常\"等\n\n======\n\
          ## 三、报告格式（V4.0 必须先写验证行，再写正文）\n\n## {{target_position}} 能力诊断报告\n\n### 一、岗位核心能力拆解\n\
          用表格列出该岗位 5-7 项核心能力，列：能力维度 | 重要度（高/中/低）| 依据来源（实时JD / 行业常识）\n\n### 二、能力现状评估\n\
          用表格评估学生当前各维度水平，**必须包含可视化列**，列：能力维度 | 当前水平 | 评分（1-10，保留1位小数）| 可视化（20格进度条）|
          评估依据（**必须引用学生实际描述**，用引号标注）\n\n**V4.0 格式要求（二节必须先写验证行）：**\n\n```\n【二节验证】评分
          X → ■=round(X×2)=N → [■×N + □×(20-N)] 总长=20 ✅\n\n| 能力维度 | 当前水平 | 评分 | 可视化
          | 评估依据 |\n|---------|---------|------|-------|---------|\n| （填） | （填） |
          X.X | 【上方的验证行对应的进度条】 | \"引用原话\" |\n```\n\n**禁止直接写进度条而不写验证行！每一条二节进度条都必须有对应的验证行！**\n\
          \n**严格示例（二节）：**\n```\n【二节验证】评分 3.5 → ■=round(3.5×2)=round(7)=7 → [■■■■■■■□□□□□□□□□□□□]
          总长=20 ✅\n\n| 英语语言综合能力 | 基础良好 | 3.5 | `[■■■■■■■□□□□□□□□□□□□]` | \"CET-4 596分...\"\
          \ |\n```\n\n### 三、关键差距分析 TOP3\n按优先级列出最需要提升的 3 个差距，列：差距描述 | 现状 vs 要求 | 真实场景下的影响\n\
          \n**差距可视化表**（必须紧跟 TOP3 表格之后）：\n\n```\n【三节验证】差距 N → ◆=round(N)=M → [◆×M +
          ◇×(10-M)] 总长=10 ✅\n\n| 能力维度 | 你的水平 | 岗位要求 | 差距 | 差距可视化 |\n|---------|---------|---------|------|-----------|\n\
          | （填） | X.X | X.X | N.N | 【上方的验证行对应的进度条】 |\n```\n\n**禁止直接写进度条而不写验证行！每一条三节进度条都必须有对应的验证行！**\n\
          \n**严格示例（三节）：**\n```\n【三节验证】差距 2.5 → ◆=round(2.5)=3 → [◆◆◆◇◇◇◇◇◇◇] 总长=10
          ✅\n\n| 教学口语能力 | 4.0 | 6.5 | 2.5 | `[◆◆◆◇◇◇◇◇◇◇]` |\n```\n\n### 四、补齐方案：4
          周行动表\n**表格必须正好 4 行，优先级分别是 P0 / P1 / P2 / P3，各 1 行不重复**\n列：优先级 | 具体任务（必须是可执行动作）
          | 推荐资源（真实存在） | 衡量标准 | 周进度可视化\n\n**V4.0 格式要求（四节必须直接查表，不计算）：**\n\n```\n【四节验证】P0
          → ━=10 → [━━━━━━━━━━] 总长=10 ✅\n【四节验证】P1 → ━=7 → [━━━━━━━───] 总长=10 ✅\n【四节验证】P2
          → ━=5 → [━━━━━─────] 总长=10 ✅\n【四节验证】P3 → ━=3 → [━━━───────] 总长=10 ✅\n\n\
          | P0 | （任务） | （资源） | （标准） | 【上方的验证行对应的进度条】 |\n```\n\n**严格示例（四节）：**\n```\n\
          【四节验证】P0 → ━=10 → [━━━━━━━━━━] 总长=10 ✅\n\n| P0 | 每日算法+项目 | LeetCode, GitHub
          | 累计20题+项目上线 | `[━━━━━━━━━━]` |\n```\n\n### 四·补、四周行动时间线总览\n\n```\n【四·补验证】第1周
          → ━=1 → [━─────────] 总长=10 ✅\n【四·补验证】第2周 → ━=2 → [━━────────] 总长=10 ✅\n\
          【四·补验证】第3周 → ━=3 → [━━━───────] 总长=10 ✅\n【四·补验证】第4周 → ━=4 → [━━━━──────]
          总长=10 ✅\n【四·补验证】第4周末 → ━=5 → [━━━━━─────] 总长=10 ✅\n\n| 周次 | 重点任务 | 完成进度
          |\n| :--- | :--- | :--- |\n| 第 1 周 | （任务） | `[━─────────] 20%` |\n| 第 2
          周 | （任务） | `[━━────────] 40%` |\n| 第 3 周 | （任务） | `[━━━───────] 60%` |\n\
          | 第 4 周 | （任务） | `[━━━━──────] 80%` |\n| 第 4 周末 | （任务） | `[━━━━━─────] 100%`
          |\n```\n\n### 五、面试准备建议\n**正好 5 条**，结合该岗位实时 JD 中的高频考点\n\n### 六、整体评分与寄语\n\
          - 综合能力评分：（X.X/10，保留 1 位小数）\n\n```\n【六节验证】综合分 X.X → ■=round(X.X)=N → [■×N
          + □×(10-N)] 总长=10 ✅\n```\n\n- 综合能力可视化：**10 格精确条**（直接查六节对照表）\n- 校招竞争力评级：S
          / A / B / C 四档之一（参考：S=顶尖 A=优秀 B=良好 C=一般）\n- 鼓励性寄语：（2-3 句话，结合学生年级和现状）\n\n\
          ### 七、能力成长路径（起点 vs 终点对比表）\n\n```\n【七节验证】起点 X.X → ■=round(X.X)=N → [■×N +
          □×(10-N)] 总长=10 ✅\n【七节验证】终点 Y.Y → ■=round(Y.Y)=M → [■×M + □×(10-M)] 总长=10
          ✅\n\n| 能力维度 | 起点（你现在） | 终点（4 周后目标） | 成长幅度 |\n|---------|---------------|------------------|---------|\n\
          | （能力 1） | X.X `[■■□□□□□□□]` | Y.Y `[■■■■□□□□□]` | ↑ N.N 分 |\n```\n\n**表格要求：**\n\
          - 能力维度必须从报告前面的小节提取（与\"二、能力现状评估\"中的维度保持一致）\n- 起点评分必须等于现状评估的分数\n- 终点评分必须合理（参考岗位要求
          + 4周可达性）\n- 成长幅度 = 终点 - 起点\n- **禁止直接写进度条而不写验证行！每一条七节进度条（起点和终点）都必须有对应的验证行！**\n\
          \n---\n\n**⚠️ V4.0 最终检查清单（输出前必须逐条核对）：**\n\n- [ ] **二节**：每个评分条**验证行 + 正文**成对出现？每条长度=20？■数=round(评分×2)？□数补齐到20？\n\
